name: Sable Quarry 648 Cutover Preflight

on:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run cutover preflight
        run: |
          set -euo pipefail
          inventory="research/fixtures/quarry-sable-648-cutover-active-work-2026-08-22.json"
          cargo run --quiet -- preflight --inventory "$inventory" --format json . \
            | tee /tmp/quarry-sable-648-cutover-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("research/fixtures/quarry-sable-648-cutover-active-work-2026-08-22.json").read_text())
          report = json.loads(Path("/tmp/quarry-sable-648-cutover-preflight.json").read_text())
          findings = report.get("findings", [])
          collisions = [f for f in findings if f.get("kind") == "preflight-inventory-path-overlap"]
          explicit = [f for f in findings if f.get("kind") == "preflight-explicit-coordination"]
          unknowns = []
          for claim in report.get("claims", []):
              if claim.get("kind") == "unknown":
                  unknowns.append(claim.get("message"))
          for finding in findings:
              for claim in finding.get("claims", []):
                  if claim.get("kind") == "unknown":
                      unknowns.append(claim.get("message"))

          assert len(inventory["active_work"]) == 7, inventory["active_work"]
          assert len(inventory["current"]["changed_paths"]) == 2
          assert collisions == [], collisions
          assert explicit == [], explicit

          receipt = {
              "supplied_work_items": 7,
              "collisions": collisions,
              "explicit_edges": inventory["coordination_edges"],
              "unknowns": unknowns,
              "next_action_changed": False,
              "consequence": "implement the two-file current-parent #648 single-head cutover/risk-execution candidate; keep closed #696/#702 as historical WIP evidence only",
              "semantic_pressure_case": "provider membership changed from five to seven while main stayed fixed; closed WIP carriers remain evidence rather than active delivery candidates",
              "provider_membership_note": "fresh refresh replaced closed #705 with new #708/#709/#710 before the exact-path preflight",
          }
          Path("/tmp/quarry-sable-648-cutover-preflight-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload cutover receipt
        uses: actions/upload-artifact@v4
        with:
          name: quarry-sable-648-cutover-preflight
          path: |
            research/fixtures/quarry-sable-648-cutover-active-work-2026-08-22.json
            /tmp/quarry-sable-648-cutover-preflight.json
            /tmp/quarry-sable-648-cutover-preflight-receipt.json
