name: External repository dogfood

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional pinned case id from research/external-dogfood-cases.json
        required: false
        default: ""
        type: string
      repository:
        description: Ad hoc public owner/repository; ignored when case_id is set
        required: true
        default: teamleaderleo/smolrunner
        type: string
      ref:
        description: Ad hoc target branch, tag, or exact commit; ignored when case_id is set
        required: true
        default: main
        type: string
      fetch_depth:
        description: Ad hoc checkout depth; 0 requests full history
        required: true
        default: "256"
        type: string
      history_file:
        description: Ad hoc repository-relative file for bounded history
        required: false
        default: src/disposable_clone_runtime.rs
        type: string
      history_max:
        description: Ad hoc history commit bound, from 1 through 1000
        required: true
        default: "100"
        type: string
      base:
        description: Ad hoc Git revision for a diff probe
        required: false
        default: ""
        type: string
      repeat_scan:
        description: Repeat an ad hoc repository scan to measure warm reuse
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4
        with:
          path: cultist

      - name: Resolve target
        id: target
        env:
          CASE_ID: ${{ inputs.case_id }}
          ADHOC_REPOSITORY: ${{ inputs.repository }}
          ADHOC_REF: ${{ inputs.ref }}
          ADHOC_FETCH_DEPTH: ${{ inputs.fetch_depth }}
          ADHOC_HISTORY_FILE: ${{ inputs.history_file }}
          ADHOC_HISTORY_MAX: ${{ inputs.history_max }}
          ADHOC_BASE: ${{ inputs.base }}
          ADHOC_REPEAT_SCAN: ${{ inputs.repeat_scan }}
        run: |
          set -euo pipefail
          if [[ -n "$CASE_ID" ]]; then
            python cultist/scripts/external_dogfood_case.py \
              --registry cultist/research/external-dogfood-cases.json \
              --case "$CASE_ID" \
              --github-output "$GITHUB_OUTPUT" \
              > resolved-target.json
          else
            args=(
              python cultist/scripts/external_dogfood_case.py
              --adhoc
              --repository "$ADHOC_REPOSITORY"
              --ref "$ADHOC_REF"
              --fetch-depth "$ADHOC_FETCH_DEPTH"
              --history-max "$ADHOC_HISTORY_MAX"
              --github-output "$GITHUB_OUTPUT"
            )
            if [[ -n "$ADHOC_HISTORY_FILE" ]]; then
              args+=(--history-file "$ADHOC_HISTORY_FILE")
            fi
            if [[ -n "$ADHOC_BASE" ]]; then
              args+=(--base "$ADHOC_BASE")
            fi
            if [[ "$ADHOC_REPEAT_SCAN" == "true" ]]; then
              args+=(--repeat-scan)
            fi
            "${args[@]}" > resolved-target.json
          fi
          cat resolved-target.json

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build Cultist
        run: cargo build --locked --release --manifest-path cultist/Cargo.toml

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: ${{ steps.target.outputs.fetch_depth }}
          persist-credentials: false
          path: target

      - name: Fetch bounded diff-base ancestry
        if: steps.target.outputs.base != ''
        env:
          TARGET_BASE: ${{ steps.target.outputs.base }}
          TARGET_FETCH_DEPTH: ${{ steps.target.outputs.fetch_depth }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_FETCH_DEPTH" == "0" ]]; then
            git -C target fetch --no-tags origin "$TARGET_BASE"
          else
            git -C target fetch --no-tags --depth="$TARGET_FETCH_DEPTH" origin "$TARGET_BASE"
          fi

      - name: Run bounded dogfood probes
        id: probes
        env:
          TARGET_FETCH_DEPTH: ${{ steps.target.outputs.fetch_depth }}
          TARGET_HISTORY_FILE: ${{ steps.target.outputs.history_file }}
          TARGET_HISTORY_MAX: ${{ steps.target.outputs.history_max }}
          TARGET_BASE: ${{ steps.target.outputs.base }}
          REPEAT_SCAN: ${{ steps.target.outputs.repeat_scan }}
        run: |
          set -euo pipefail
          args=(
            python cultist/scripts/external_dogfood.py
            --cultist "$PWD/cultist/target/release/cargo-cultist"
            --repo "$PWD/target"
            --output-dir "$PWD/artifacts"
            --cache-dir "$RUNNER_TEMP/cultist-cache"
            --checkout-depth "$TARGET_FETCH_DEPTH"
            --history-max "$TARGET_HISTORY_MAX"
          )
          if [[ -n "$TARGET_HISTORY_FILE" ]]; then
            args+=(--history-file "$TARGET_HISTORY_FILE")
          fi
          if [[ -n "$TARGET_BASE" ]]; then
            args+=(--base "$TARGET_BASE")
          fi
          if [[ "$REPEAT_SCAN" == "true" ]]; then
            args+=(--repeat-scan)
          fi
          "${args[@]}"

      - name: Write job summary
        if: always()
        env:
          CASE_ID: ${{ steps.target.outputs.case_id }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SOURCE: ${{ steps.target.outputs.source }}
          TARGET_QUESTION: ${{ steps.target.outputs.question }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("artifacts/summary.json")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## External Cultist dogfood\n\n")
              out.write(f"Case: `{os.environ.get('CASE_ID', '')}`\n\n")
              out.write(f"Target: `{os.environ['TARGET_REPOSITORY']}@{os.environ['TARGET_REF']}`\n\n")
              out.write(f"Source: `{os.environ.get('TARGET_SOURCE', '')}`\n\n")
              out.write(f"Question: {os.environ.get('TARGET_QUESTION', '')}\n\n")
              if not summary_path.is_file():
                  out.write("Probe summary was unavailable.\n")
                  raise SystemExit(0)
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              target = summary["target"]
              out.write(
                  f"HEAD: `{target['head']}` · shallow: `{target['shallow']}` · "
                  f"checkout depth: `{target['checkout_depth']}`\n\n"
              )
              out.write("| probe | findings | git processes | Rust parses | cache hits | wall µs |\n")
              out.write("|---|---:|---:|---:|---:|---:|\n")
              for probe in summary["probes"]:
                  perf = probe.get("performance") or {}
                  out.write(
                      f"| {probe['name']} | {probe.get('finding_count')} | "
                      f"{perf.get('git_subprocesses')} | {perf.get('rust_files_parsed')} | "
                      f"{perf.get('rust_cache_hits')} | {perf.get('wall_time_us')} |\n"
                  )
          PY

      - name: Upload dogfood receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-dogfood-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
