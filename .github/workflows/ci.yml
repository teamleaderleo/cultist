name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Project-memory lineage controls
        run: |
          python -m py_compile \
            scripts/project_memory_github.py \
            scripts/project_memory_github_issue.py \
            scripts/project_memory_github_lineage.py \
            scripts/project_memory_github_lineage_test.py
          python scripts/project_memory_github_lineage_test.py
      - name: GitHub review-memory adapter controls
        run: |
          python -m py_compile \
            scripts/project_memory_github.py \
            scripts/review_memory_github.py \
            scripts/review_memory_github_test.py
          python scripts/review_memory_github_test.py
      - name: GitHub issue-closure adapter controls
        run: |
          python -m py_compile \
            scripts/project_memory_github.py \
            scripts/closure_episode_github.py \
            scripts/closure_episode_github_test.py
          python scripts/closure_episode_github_test.py
      - name: External GitHub reference controls
        run: |
          python -m py_compile \
            scripts/github_reference_url.py \
            scripts/github_reference_url_test.py \
            scripts/external_github_reference_guard.py \
            scripts/external_github_reference_guard_test.py \
            scripts/external_github_reference_preflight_test.py
          python scripts/github_reference_url_test.py
          python scripts/external_github_reference_guard_test.py
          python scripts/external_github_reference_preflight_test.py
      - name: External GitHub reference post-write detector for pull request
        if: github.event_name == 'pull_request'
        env:
          CULTIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/external_github_reference_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --base "$CULTIST_BASE" \
            --event "$GITHUB_EVENT_PATH"
      - name: External GitHub reference detector for push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CULTIST_BASE: ${{ github.event.before }}
        run: |
          python scripts/external_github_reference_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --base "$CULTIST_BASE"
      - name: Active work heads-up
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: python scripts/active_work_heads_up_ci.py
      - name: Quarry Sable active-work preflight receipt
        if: github.event_name == 'pull_request' && github.head_ref == 'dogfood/sable-quarry-preflight-20260822'
        run: |
          set -euo pipefail
          inventory="research/fixtures/quarry-sable-active-work-2026-08-22.json"
          cargo run --quiet -- preflight --inventory "$inventory" --format json . \
            | tee /tmp/quarry-sable-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("research/fixtures/quarry-sable-active-work-2026-08-22.json").read_text())
          report = json.loads(Path("/tmp/quarry-sable-preflight.json").read_text())
          findings = report.get("findings", [])
          collisions = [
              finding for finding in findings
              if finding.get("kind") == "preflight-inventory-path-overlap"
          ]
          explicit = [
              finding for finding in findings
              if finding.get("kind") == "preflight-explicit-coordination"
          ]
          unknowns = []
          for claim in report.get("claims", []):
              if claim.get("kind") == "unknown":
                  unknowns.append(claim.get("message"))
          for finding in findings:
              for claim in finding.get("claims", []):
                  if claim.get("kind") == "unknown":
                      unknowns.append(claim.get("message"))

          collision_paths = sorted(
              finding.get("location", {}).get("path") for finding in collisions
          )
          expected_paths = [
              "src/quarry/btc_momentum_prospective.py",
              "tests/test_btc_momentum_prospective.py",
          ]
          assert len(inventory["active_work"]) == 6, inventory["active_work"]
          assert collision_paths == expected_paths, collision_paths
          assert len(inventory.get("coordination_edges", [])) == 1, inventory.get("coordination_edges")
          assert len(explicit) == 1, explicit

          receipt = {
              "supplied_work_items": len(inventory["active_work"]),
              "collisions": collision_paths,
              "explicit_edges": inventory.get("coordination_edges", []),
              "unknowns": unknowns,
              "next_action_changed": True,
              "consequence": "review live #670/#671 and avoid duplicate prospective implementation",
              "provider_membership_note": "snapshot independently refreshed from all open Quarry PRs before this run",
          }
          Path("/tmp/quarry-sable-preflight-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload Quarry Sable preflight receipt
        if: github.event_name == 'pull_request' && github.head_ref == 'dogfood/sable-quarry-preflight-20260822'
        uses: actions/upload-artifact@v4
        with:
          name: quarry-sable-active-work-preflight
          path: |
            research/fixtures/quarry-sable-active-work-2026-08-22.json
            /tmp/quarry-sable-preflight.json
            /tmp/quarry-sable-preflight-receipt.json
      - name: Test
        run: cargo test
      - name: Dogfood repository scan
        run: cargo run -- .
      - name: Dogfood repository JSON
        run: cargo run --quiet -- --format json . | python -m json.tool >/dev/null
      - name: Dogfood history companions
        run: cargo run -- history --max-commits 20 src/main.rs
      - name: Dogfood history JSON
        run: cargo run --quiet -- history --max-commits 20 --format json src/main.rs | python -m json.tool >/dev/null
      - name: Dogfood CI test-filter inventory
        run: cargo run -- ci-tests .
      - name: Dogfood CI test-filter JSON
        run: cargo run --quiet -- ci-tests --format json . | python -m json.tool >/dev/null
      - name: Exercise CI test-filter positive and control fixtures
        run: |
          set -euo pipefail

          fixture="$(mktemp -d)"
          mkdir -p "$fixture/src" "$fixture/.github/workflows"
          git -C "$fixture" init -q

          cat > "$fixture/src/lib.rs" <<'EOF'
          #[cfg(test)]
          mod tests {
              #[test]
              fn existing_test() {}
          }
          EOF

          cat > "$fixture/.github/workflows/test.yml" <<'EOF'
          name: fixture
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: cargo test --lib stale_filter
          EOF

          cargo run --quiet -- ci-tests --format json "$fixture" > /tmp/cultist-ci-test-stale.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-ci-test-stale.json').read_text())
          findings = report['findings']
          assert len(findings) == 1, findings
          finding = findings[0]
          assert finding['kind'] == 'ci-test-filter-inventory-miss', finding
          assert [claim['kind'] for claim in finding['claims']] == [
              'proven', 'observed', 'unknown'
          ], finding
          assert 'stale_filter' in finding['question'], finding
          PY

          sed -i 's/stale_filter/existing_test/' "$fixture/.github/workflows/test.yml"
          cargo run --quiet -- ci-tests --format json "$fixture" > /tmp/cultist-ci-test-control.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-ci-test-control.json').read_text())
          assert report['findings'] == [], report
          PY
      - name: Dogfood pull request diff
        if: github.event_name == 'pull_request'
        env:
          CULTIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo run -- diff --base "$CULTIST_BASE" .
      - name: Dogfood pull request JSON
        if: github.event_name == 'pull_request'
        env:
          CULTIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo run --quiet -- diff --base "$CULTIST_BASE" --format json . | python -m json.tool >/dev/null
      - name: Dogfood push diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CULTIST_BASE: ${{ github.event.before }}
        run: cargo run -- diff --base "$CULTIST_BASE" .
