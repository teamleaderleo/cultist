name: JEI historical budget pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/jei-history-pilot.yml"
      - "scripts/jei_history_pilot.py"
      - "research/external-dogfood-cases.json"

permissions:
  contents: read

jobs:
  glaeda-historical-same-target-positive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4
        with:
          path: cultist

      - name: Resolve pinned positive-control case
        id: target
        run: |
          python cultist/scripts/external_dogfood_case.py \
            --registry cultist/research/external-dogfood-cases.json \
            --case smolrunner-disposable-clone-history \
            --github-output "$GITHUB_OUTPUT" \
            > resolved-target.json
          cat resolved-target.json

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build agent context packet research example
        run: cargo build --locked --release --example agent_context_packet --manifest-path cultist/Cargo.toml

      - name: Checkout pinned Glaeda historical corpus
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: ${{ steps.target.outputs.fetch_depth }}
          persist-credentials: false
          path: target

      - name: Verify exact positive-control coordinate
        env:
          EXPECTED_HEAD: ${{ steps.target.outputs.ref }}
          TARGET_FILE: ${{ steps.target.outputs.history_file }}
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          test -f "target/$TARGET_FILE"
          history="$(git -C target log --no-merges --format='%s' -n 20 -- "$TARGET_FILE")"
          printf '%s\n' "$history"
          grep -F "Remove duplicate worker readiness probes (#540)" <<<"$history"
          grep -F "Reduce live admission latency before JIT" <<<"$history"
          grep -F "fix: collapse redundant clone admission polls (#533)" <<<"$history"
          grep -F "keep clone preflight before durable checkpoint (#530)" <<<"$history"

      - name: Sweep positive-control JEI budgets
        env:
          TARGET_FILE: ${{ steps.target.outputs.history_file }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_SOURCE: ${{ steps.target.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python cultist/scripts/jei_history_pilot.py \
            --packet-exe "$PWD/cultist/target/release/examples/agent_context_packet" \
            --repo "$PWD/target" \
            --target "$TARGET_FILE" \
            --repository-label "$TARGET_REPOSITORY" \
            --source "$TARGET_SOURCE" \
            --expectation preserve_all \
            --budget 1048576 \
            --budget 32768 \
            --budget 16384 \
            --budget 8192 \
            --budget 4096 \
            --control-budget 1048576 \
            --acceptance-budget 32768 \
            --required-subject "Remove duplicate worker readiness probes (#540)" \
            --required-subject "Reduce live admission latency before JIT" \
            --required-subject "fix: collapse redundant clone admission polls (#533)" \
            --required-subject "keep clone preflight before durable checkpoint (#530)" \
            --output "$PWD/artifacts/smolrunner-same-target-positive.json"

      - name: Upload positive-control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-positive-smolrunner-${{ github.run_id }}
          path: artifacts/smolrunner-same-target-positive.json
          if-no-files-found: error

  stensibly-cross-file-negative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4
        with:
          path: cultist

      - name: Resolve pinned negative-control case
        id: target
        run: |
          python cultist/scripts/external_dogfood_case.py \
            --registry cultist/research/external-dogfood-cases.json \
            --case stensibly-1575-pre-guard-jei \
            --github-output "$GITHUB_OUTPUT" \
            > resolved-target.json
          cat resolved-target.json

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build agent context packet research example
        run: cargo build --locked --release --example agent_context_packet --manifest-path cultist/Cargo.toml

      - name: Checkout pinned Stensibly state
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: ${{ steps.target.outputs.fetch_depth }}
          persist-credentials: false
          path: target

      - name: Verify exact negative-control coordinate and distributed lessons
        env:
          EXPECTED_HEAD: ${{ steps.target.outputs.ref }}
          TARGET_FILE: ${{ steps.target.outputs.history_file }}
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          test -f "target/$TARGET_FILE"

          target_history="$(git -C target log --no-merges --format='%s' -n 20 -- "$TARGET_FILE")"
          printf '%s\n' "$target_history"
          if grep -F "Keep Gmail semantic-admission indexes deployable (#1571)" <<<"$target_history"; then
            echo "unexpected: #1571 appears in file-local negative-control history" >&2
            exit 1
          fi
          if grep -F "Keep Gmail mailbox-disposition indexes deployable (#1573)" <<<"$target_history"; then
            echo "unexpected: #1573 appears in file-local negative-control history" >&2
            exit 1
          fi

          semantic_history="$(git -C target log --no-merges --format='%s' -n 20 -- convex/mailSemanticAdmissionSchema.ts)"
          disposition_history="$(git -C target log --no-merges --format='%s' -n 20 -- convex/gmailMailboxDispositionSchema.ts)"
          grep -F "Keep Gmail semantic-admission indexes deployable (#1571)" <<<"$semantic_history"
          grep -F "Keep Gmail mailbox-disposition indexes deployable (#1573)" <<<"$disposition_history"

      - name: Sweep negative-control JEI budgets
        env:
          TARGET_FILE: ${{ steps.target.outputs.history_file }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET_SOURCE: ${{ steps.target.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python cultist/scripts/jei_history_pilot.py \
            --packet-exe "$PWD/cultist/target/release/examples/agent_context_packet" \
            --repo "$PWD/target" \
            --target "$TARGET_FILE" \
            --repository-label "$TARGET_REPOSITORY" \
            --source "$TARGET_SOURCE" \
            --expectation miss_all \
            --budget 1048576 \
            --budget 32768 \
            --budget 16384 \
            --budget 8192 \
            --budget 4096 \
            --control-budget 1048576 \
            --acceptance-budget 32768 \
            --required-subject "Keep Gmail semantic-admission indexes deployable (#1571)" \
            --required-subject "Keep Gmail mailbox-disposition indexes deployable (#1573)" \
            --output "$PWD/artifacts/stensibly-cross-file-negative.json"

      - name: Upload negative-control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jei-negative-stensibly-${{ github.run_id }}
          path: artifacts/stensibly-cross-file-negative.json
          if-no-files-found: error

  summarize:
    if: always()
    needs:
      - glaeda-historical-same-target-positive
      - stensibly-cross-file-negative
    runs-on: ubuntu-latest
    steps:
      - name: Download positive-control receipt
        uses: actions/download-artifact@v4
        with:
          name: jei-positive-smolrunner-${{ github.run_id }}
          path: receipts/positive

      - name: Download negative-control receipt
        uses: actions/download-artifact@v4
        with:
          name: jei-negative-stensibly-${{ github.run_id }}
          path: receipts/negative

      - name: Write pilot summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths = [
              ("Positive · Glaeda historical corpus · same-target history", Path("receipts/positive/smolrunner-same-target-positive.json")),
              ("Negative · Stensibly cross-file history", Path("receipts/negative/stensibly-cross-file-negative.json")),
          ]
          overall = True
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## JEI historical pilot matrix\n\n")
              for title, path in paths:
                  receipt = json.loads(path.read_text(encoding="utf-8"))
                  passed = receipt["acceptance"]["passed"]
                  overall = overall and passed
                  out.write(f"### {title}\n\n")
                  out.write(f"Expectation: `{receipt['expectation']}` · result: `{'PASS' if passed else 'FAIL'}`  \n")
                  out.write(f"Pinned revision: `{receipt['revision']}` · target: `{receipt['target']}`\n\n")
                  out.write("| budget | status | candidate bytes | selected bytes | any lesson | all lessons | evictions |\n")
                  out.write("|---:|---|---:|---:|---|---|---|\n")
                  for result in receipt["results"]:
                      evictions = ", ".join(
                          f"{entry.get('class')}={entry.get('count')}"
                          for entry in result.get("semantic_evictions", [])
                      ) or "—"
                      out.write(
                          f"| {result['budget']} | {result['status']} | "
                          f"{result.get('candidate_serialized_bytes', '—')} | "
                          f"{result.get('serialized_bytes', '—')} | "
                          f"{'yes' if result.get('preserves_any_required') else 'no'} | "
                          f"{'yes' if result.get('preserves_all_required') else 'no'} | {evictions} |\n"
                      )
                  out.write("\n")
              out.write(f"**Overall pilot:** `{'PASS' if overall else 'FAIL'}`\n")
          if not overall:
              raise SystemExit(1)
          PY
