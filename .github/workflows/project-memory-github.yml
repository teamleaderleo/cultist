name: GitHub project-memory packet

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub owner/repository
        required: true
        default: teamleaderleo/stensibly
        type: string
      anchor_pr:
        description: Pull request number to use as the one-hop memory anchor
        required: true
        default: "1575"
        type: string
      max_artifacts:
        description: Maximum admitted artifacts including the anchor, 2 through 32
        required: true
        default: "16"
        type: string

permissions:
  contents: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check collector syntax and reference controls
        run: |
          python -m py_compile scripts/project_memory_github.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/project_memory_github.py")
          spec = importlib.util.spec_from_file_location("project_memory_github", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          anchor = {
              "reference": {"kind": "pull_request", "number": 1},
              "evidence_text": (
                  "Follow-up to repairs #1569/#1571/#1573.\n"
                  "Related: other/repo#123 and #456"
              ),
          }
          edges = module.explicit_anchor_edges(anchor)
          pairs = [(edge["relation"], edge["to"]["number"]) for edge in edges]
          assert pairs == [
              ("follow_up_to", 1569),
              ("follow_up_to", 1571),
              ("follow_up_to", 1573),
              ("related", 456),
          ], pairs
          PY

      - name: Collect one-hop project memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_ANCHOR_PR: ${{ inputs.anchor_pr }}
          MAX_ARTIFACTS: ${{ inputs.max_artifacts }}
        run: |
          set -euo pipefail
          python scripts/project_memory_github.py \
            --repository "$TARGET_REPOSITORY" \
            --anchor-pr "$TARGET_ANCHOR_PR" \
            --max-artifacts "$MAX_ARTIFACTS" \
            --output project-memory.json \
            > /tmp/project-memory-collector.stdout

      - name: Validate with offline packet reader
        run: |
          cargo run --locked --quiet --example project_memory_packet \
            < project-memory.json \
            > project-memory-summary.json

      - name: Write job summary
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_ANCHOR_PR: ${{ inputs.anchor_pr }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          packet = json.loads(Path("project-memory.json").read_text())
          summary = json.loads(Path("project-memory-summary.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## GitHub project memory\n\n")
              out.write(
                  f"Anchor: `{os.environ['TARGET_REPOSITORY']}#"
                  f"{os.environ['TARGET_ANCHOR_PR']}`\n\n"
              )
              out.write(
                  f"Artifacts: **{summary['artifact_count']}** · "
                  f"explicit edges: **{summary['edge_count']}**\n\n"
              )
              out.write("| relation | target | evidence |\n|---|---|---|\n")
              for link in summary["explicit_anchor_links"]:
                  target = link["target"]
                  evidence = link["evidence"].replace("|", "\\|")
                  out.write(
                      f"| {link['relation']} | {target['kind']} #{target['number']} | "
                      f"{evidence} |\n"
                  )
              out.write("\nChanged paths on anchor:\n\n")
              for path in summary["anchor_changed_paths"]:
                  out.write(f"- `{path}`\n")
              out.write(
                  "\nCollector scope: one-hop explicit same-repository references from "
                  "the selected PR body. Chronology is not promoted to a relationship.\n"
              )
          PY

      - name: Upload packet receipt
        uses: actions/upload-artifact@v4
        with:
          name: project-memory-${{ github.run_id }}
          path: |
            project-memory.json
            project-memory-summary.json
          if-no-files-found: error
